<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurfaceOS Snip</title>
<style>
  :root {
    --ink: #13233b;
    --grid: rgba(160, 200, 255, 0.08);
    --grid-major: rgba(160, 200, 255, 0.16);
    --paper: #eef3fa;
    --cursor: #8fdcff;
    --press: #ffb347;
    --muted: #7d93b2;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    cursor: none;
  }

  body {
    background-color: var(--ink);
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    color: var(--paper);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }

  #status {
    position: fixed;
    top: 24px;
    left: 28px;
    font-size: 18px;
    color: var(--muted);
  }

  #status.live { color: var(--paper); }

  #hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    color: var(--muted);
    text-align: center;
  }

  .cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border: 4px solid var(--cursor);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 150ms, width 80ms, height 80ms, margin 80ms, background-color 80ms;
  }

  .cursor.visible { opacity: 1; }

  .cursor.pinching {
    width: 28px;
    height: 28px;
    margin: -14px 0 0 -14px;
    background-color: var(--press);
    border-color: var(--press);
  }

  #snip {
    position: fixed;
    border: 3px dashed var(--press);
    /* The huge spread shadow dims everything outside the selection. */
    box-shadow: 0 0 0 9999px rgba(5, 10, 20, 0.5);
    pointer-events: none;
    display: none;
  }

  #snip.visible { display: block; }

  #snip-size {
    position: absolute;
    top: -34px;
    left: 0;
    font-size: 16px;
    color: var(--press);
    white-space: nowrap;
  }

  /* While Python takes the screenshot, hide every overlay so it is not in the image. */
  body.capturing .cursor,
  body.capturing #snip,
  body.capturing #status,
  body.capturing #hint,
  body.capturing #saved { visibility: hidden; }

  #saved {
    position: fixed;
    top: 24px;
    right: 28px;
    padding: 12px 18px;
    border-radius: 12px;
    background-color: var(--press);
    color: var(--ink);
    font-size: 18px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 200ms, transform 200ms;
  }

  #saved.visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor, #saved { transition: none; }
  }
</style>
</head>
<body>
  <div id="status">Start snip_server.py to connect the hand tracker</div>
  <div id="hint">Pinch with both hands, pull them apart to frame an area, then let go to snip</div>

  <div id="snip"><span id="snip-size"></span></div>
  <div class="cursor"></div>
  <div class="cursor"></div>
  <div id="saved"></div>

<script>
  const SERVER_URL = "ws://localhost:8765";

  const cursors = document.querySelectorAll(".cursor");
  const snipBox = document.getElementById("snip");
  const snipSize = document.getElementById("snip-size");
  const statusText = document.getElementById("status");
  const savedNotice = document.getElementById("saved");

  let knownSnipCount = null;
  let savedTimer = null;

  function showSaved(filename) {
    savedNotice.textContent = `Saved ${filename}`;
    savedNotice.classList.add("visible");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => savedNotice.classList.remove("visible"), 2500);
  }

  function handleFrame(data) {
    const w = window.innerWidth;
    const h = window.innerHeight;

    cursors.forEach((cursor, i) => {
      const hand = data.hands[i];
      if (!hand) {
        cursor.classList.remove("visible", "pinching");
        return;
      }
      cursor.style.transform = `translate(${hand.x * w}px, ${hand.y * h}px)`;
      cursor.classList.add("visible");
      cursor.classList.toggle("pinching", hand.pinch);
    });

    const handCount = data.hands.length;
    statusText.textContent =
      handCount === 0 ? "Connected. Hold your hands up to the camera." :
      handCount === 1 ? "Tracking 1 hand. Snipping needs both." :
      "Tracking 2 hands";

    if (data.snip) {
      const left = data.snip.x1 * w;
      const top = data.snip.y1 * h;
      const width = (data.snip.x2 - data.snip.x1) * w;
      const height = (data.snip.y2 - data.snip.y1) * h;
      snipBox.style.left = `${left}px`;
      snipBox.style.top = `${top}px`;
      snipBox.style.width = `${width}px`;
      snipBox.style.height = `${height}px`;
      snipSize.textContent = `${Math.round(width)} × ${Math.round(height)}`;
      snipBox.classList.add("visible");
    } else {
      snipBox.classList.remove("visible");
    }

    document.body.classList.toggle("capturing", data.capturing);

    // The first message sets the baseline so reconnecting does not show an old snip.
    if (knownSnipCount === null) {
      knownSnipCount = data.snip_count;
    } else if (data.snip_count > knownSnipCount) {
      knownSnipCount = data.snip_count;
      showSaved(data.last_snip);
    }
  }

  function connect() {
    const socket = new WebSocket(SERVER_URL);

    socket.onopen = () => {
      statusText.classList.add("live");
      statusText.textContent = "Connected. Hold your hands up to the camera.";
    };

    socket.onmessage = (event) => handleFrame(JSON.parse(event.data));

    socket.onclose = () => {
      statusText.classList.remove("live");
      statusText.textContent = "Hand tracker not running. Start snip_server.py, retrying...";
      cursors.forEach((cursor) => cursor.classList.remove("visible"));
      snipBox.classList.remove("visible");
      setTimeout(connect, 1000);
    };
  }

  connect();
</script>
</body>
</html>
