<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurfaceOS widgets</title>
<link rel="stylesheet" href="widgets.css">
<style>
  /* Stand-in shell styles for this demo only. Carter's shell replaces all of this. */
  :root {
    --ink: #13233b;
    --grid: rgba(160, 200, 255, 0.08);
    --grid-major: rgba(160, 200, 255, 0.16);
    --paper: #eef3fa;
    --cursor: #8fdcff;
    --press: #ffb347;
    --muted: #7d93b2;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background-color: var(--ink);
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    color: var(--paper);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }

  #canvas { position: fixed; inset: 0; touch-action: none; }

  .demo-window {
    position: absolute;
    border: 2px solid rgba(238, 243, 250, 0.35);
    border-radius: 16px;
    background-color: rgba(19, 35, 59, 0.85);
  }

  .demo-window-tab {
    position: absolute;
    bottom: 100%;
    left: 12px;
    margin-bottom: 6px;
    font-size: 14px;
    color: var(--muted);
  }

  #toolbar {
    position: fixed;
    top: 20px;
    left: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  #toolbar button {
    font: inherit;
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--muted);
    background-color: rgba(19, 35, 59, 0.9);
    color: var(--paper);
    cursor: pointer;
  }

  #toolbar button:disabled { opacity: 0.5; cursor: default; }

  #toolbar span { font-size: 14px; color: var(--muted); }

  #log {
    position: fixed;
    right: 24px;
    bottom: 20px;
    width: min(420px, calc(100vw - 48px));
    max-height: 30vh;
    overflow: auto;
    padding: 10px 14px;
    list-style: none;
    border-radius: 12px;
    background-color: rgba(5, 10, 20, 0.7);
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
  }

  #log:empty { display: none; }

  #log li.action { color: var(--paper); }

  #fake-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 36px;
    height: 36px;
    margin: -18px 0 0 -18px;
    border: 4px solid var(--cursor);
    border-radius: 50%;
    pointer-events: none;
  }

  #fake-cursor.pressing { background-color: var(--press); border-color: var(--press); }
</style>
</head>
<body>
  <div id="canvas"></div>

  <div id="toolbar">
    <button id="play">Play fake hand stream</button>
    <button id="broken">Show broken layout</button>
    <button id="reset">Reset</button>
    <span>Mouse: press and release on a button to activate it. Escape cancels a press.</span>
  </div>

  <ul id="log"></ul>
  <div id="fake-cursor" hidden></div>

<script type="module">
  import { createWidgetRenderer } from "./widget-renderer.js";
  import { FIXTURE_WINDOWS, workspaceLayout, notesLayout, brokenLayout, fakeHandStream, NOTES } from "./widget-fixtures.js";

  const canvas = document.getElementById("canvas");
  const logList = document.getElementById("log");
  const fakeCursor = document.getElementById("fake-cursor");
  const playButton = document.getElementById("play");

  function log(text, isAction = false) {
    const entry = document.createElement("li");
    entry.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
    entry.classList.toggle("action", isAction);
    logList.prepend(entry);
    while (logList.children.length > 40) logList.lastChild.remove();
  }

  // ---- Stand-in shell state. Carter's shell owns the real version of this. ----

  const windows = FIXTURE_WINDOWS.map((record) => ({ record: { ...record }, state: {} }));

  function layoutFor(win) {
    if (win.state.broken) return brokenLayout(win.record.id);
    if (win.record.content === "notes") return notesLayout(win.record.id, win.state.noteIndex);
    return workspaceLayout(win.record.id, win.state.pressCount);
  }

  function resetState(win) {
    win.state = { pressCount: 0, noteIndex: 0, broken: false };
  }

  function render(win) {
    win.layout = layoutFor(win);
    win.renderer.renderLayout(win.layout);
  }

  function handleWidgetAction(action) {
    const win = windows.find((w) => w.record.id === action.window_id);
    // Reject actions for windows or widgets that are no longer on screen.
    if (!win || !win.layout.widgets.some((widget) => widget.id === action.widget_id)) {
      log(`ignored stale action ${JSON.stringify(action)}`);
      return;
    }
    log(JSON.stringify(action), true);

    const id = action.widget_id;
    if (id === "counter") win.state.pressCount += 1;
    else if (id === "next") win.state.noteIndex = (win.state.noteIndex + 1) % NOTES.length;
    else if (id === "prev") win.state.noteIndex = (win.state.noteIndex + NOTES.length - 1) % NOTES.length;
    else if (id === "capture" || id === "ask") log(`  "${id}" is not connected yet; the shell decides what it does`);
    else return;
    render(win);
  }

  for (const win of windows) {
    const frame = document.createElement("div");
    frame.className = "demo-window";
    frame.style.left = `${win.record.x * 100}%`;
    frame.style.top = `${win.record.y * 100}%`;
    frame.style.width = `${win.record.width * 100}%`;
    frame.style.height = `${win.record.height * 100}%`;
    const tab = document.createElement("div");
    tab.className = "demo-window-tab";
    tab.textContent = `${win.record.id} · ${win.record.content}`;
    // The widget renderer only ever touches this dedicated content element.
    const content = document.createElement("div");
    content.className = "demo-window-content";
    frame.append(tab, content);
    canvas.append(frame);

    win.content = content;
    win.renderer = createWidgetRenderer(content, { onAction: handleWidgetAction });
    resetState(win);
    render(win);
  }

  // ---- Pointer routing: full-canvas event -> the right window, in its local space. ----

  let capturedWindow = null;

  function toLocal(win, event) {
    const canvasBox = canvas.getBoundingClientRect();
    const box = win.content.getBoundingClientRect();
    const px = canvasBox.left + event.x * canvasBox.width;
    const py = canvasBox.top + event.y * canvasBox.height;
    return { ...event, x: (px - box.left) / box.width, y: (py - box.top) / box.height };
  }

  function windowAt(event) {
    // Later windows are drawn on top, so search from the end.
    for (let i = windows.length - 1; i >= 0; i -= 1) {
      const local = toLocal(windows[i], event);
      if (local.x >= 0 && local.x <= 1 && local.y >= 0 && local.y <= 1) return windows[i];
    }
    return null;
  }

  function dispatchCanvasPointer(event) {
    if (event.type === "pointer_cancel") {
      windows.forEach((win) => win.renderer.handlePointer(event));
      capturedWindow = null;
      return;
    }
    if (event.type === "pointer_down") {
      capturedWindow = windowAt(event);
      if (capturedWindow) capturedWindow.renderer.handlePointer(toLocal(capturedWindow, event));
      return;
    }
    if (event.type === "pointer_up") {
      if (capturedWindow) capturedWindow.renderer.handlePointer(toLocal(capturedWindow, event));
      capturedWindow = null;
      // Refresh hover everywhere after release.
      windows.forEach((win) => win.renderer.handlePointer({ ...toLocal(win, event), type: "pointer_move" }));
      return;
    }
    // pointer_move: a held press stays with its window; otherwise every window updates hover.
    const targets = capturedWindow ? [capturedWindow] : windows;
    targets.forEach((win) => win.renderer.handlePointer(toLocal(win, event)));
  }

  // ---- Mouse adapter: emits the same event shape the hand tracker will. ----

  function mouseEvent(type, domEvent) {
    const box = canvas.getBoundingClientRect();
    const clamp = (v) => Math.min(1, Math.max(0, v));
    return {
      version: 1,
      type,
      x: clamp((domEvent.clientX - box.left) / box.width),
      y: clamp((domEvent.clientY - box.top) / box.height),
      source: "mouse",
    };
  }

  let mouseDown = false;
  canvas.addEventListener("pointermove", (e) => dispatchCanvasPointer(mouseEvent("pointer_move", e)));
  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    mouseDown = true;
    canvas.setPointerCapture(e.pointerId);
    dispatchCanvasPointer(mouseEvent("pointer_down", e));
  });
  canvas.addEventListener("pointerup", (e) => {
    if (!mouseDown) return;
    mouseDown = false;
    dispatchCanvasPointer(mouseEvent("pointer_up", e));
  });
  const cancelMouse = () => {
    if (!mouseDown) return;
    mouseDown = false;
    dispatchCanvasPointer({ version: 1, type: "pointer_cancel", source: "mouse" });
  };
  canvas.addEventListener("pointercancel", cancelMouse);
  window.addEventListener("blur", cancelMouse);
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") cancelMouse(); });

  // ---- Toolbar ----

  playButton.addEventListener("click", () => {
    const steps = fakeHandStream(windows.map((w) => w.record));
    playButton.disabled = true;
    fakeCursor.hidden = false;
    log("fake hand stream: expect capture, then next; the ask and counter presses are abandoned");
    let i = 0;
    const timer = setInterval(() => {
      const step = steps[i];
      i += 1;
      if (!step) {
        clearInterval(timer);
        fakeCursor.hidden = true;
        fakeCursor.classList.remove("pressing");
        playButton.disabled = false;
        return;
      }
      if (step.type === "pointer_down") fakeCursor.classList.add("pressing");
      if (step.type === "pointer_up" || step.type === "pointer_cancel") fakeCursor.classList.remove("pressing");
      if (step.type === "pointer_cancel") log("fake hand stream: tracking lost (pointer_cancel)");
      if (Number.isFinite(step.x)) {
        fakeCursor.style.transform = `translate(${step.x * window.innerWidth}px, ${step.y * window.innerHeight}px)`;
      }
      dispatchCanvasPointer(step);
    }, 90);
  });

  document.getElementById("broken").addEventListener("click", () => {
    const win = windows[1];
    win.state.broken = !win.state.broken;
    render(win);
  });

  document.getElementById("reset").addEventListener("click", () => {
    windows.forEach((win) => { resetState(win); render(win); });
    logList.replaceChildren();
  });

  // widget-demo.html?autoplay runs the fake hand stream on load, for hands-free checks.
  if (new URLSearchParams(location.search).has("autoplay")) playButton.click();
</script>
</body>
</html>
