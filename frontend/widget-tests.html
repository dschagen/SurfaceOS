<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SurfaceOS widget tests</title>
<link rel="stylesheet" href="widgets.css">
<style>
  body { font-family: Consolas, monospace; background: #13233b; color: #eef3fa; padding: 20px; }
  .pass { color: #8fdcff; }
  .fail { color: #ff8a7a; font-weight: bold; }
  .sandbox { position: absolute; left: -9999px; width: 400px; height: 300px; }
</style>
</head>
<body>
<h1 id="summary">Running...</h1>
<ul id="results"></ul>

<script type="module">
  import { createWidgetRenderer } from "./widget-renderer.js";

  // Fixture layouts in window-local coordinates.
  function workspaceLayout(windowId, pressCount = 0) {
    return {
      version: 1,
      window_id: windowId,
      widgets: [
        { id: "title", type: "text", x: 0.05, y: 0.03, width: 0.9, height: 0.16, text: "Workspace" },
        { id: "capture", type: "button", x: 0.08, y: 0.24, width: 0.4, height: 0.22, text: "Capture area" },
        { id: "ask", type: "button", x: 0.52, y: 0.24, width: 0.4, height: 0.22, text: "Ask AI" },
        { id: "counter", type: "button", x: 0.08, y: 0.56, width: 0.84, height: 0.22, text: "Press me" },
        {
          id: "count",
          type: "text",
          x: 0.05,
          y: 0.82,
          width: 0.9,
          height: 0.14,
          text: `Pressed ${pressCount} ${pressCount === 1 ? "time" : "times"}`,
        },
      ],
    };
  }

  function notesLayout(windowId) {
    return {
      version: 1,
      window_id: windowId,
      widgets: [
        { id: "note", type: "text", x: 0.05, y: 0.06, width: 0.9, height: 0.56, text: "A second layout" },
        { id: "prev", type: "button", x: 0.08, y: 0.7, width: 0.38, height: 0.22, text: "Back" },
        { id: "next", type: "button", x: 0.54, y: 0.7, width: 0.38, height: 0.22, text: "Next" },
      ],
    };
  }

  function brokenLayout(windowId) {
    return {
      version: 1,
      window_id: windowId,
      widgets: [
        { id: "ok", type: "button", x: 0.1, y: 0.1, width: 0.8, height: 0.25, text: "Still works" },
        { id: "slider", type: "slider", x: 0.1, y: 0.4, width: 0.8, height: 0.1 },
        { id: "ok", type: "text", x: 0.1, y: 0.55, width: 0.8, height: 0.1, text: "duplicate id" },
        { id: "huge", type: "button", x: 0.5, y: 0.5, width: 0.9, height: 0.2, text: "outside" },
        { type: "text", x: 0, y: 0, width: 0.1, height: 0.1, text: "no id" },
        { id: "html", type: "text", x: 0.1, y: 0.8, width: 0.8, height: 0.15, text: "<b>shown as text, not bold</b>" },
      ],
    };
  }

  const results = document.getElementById("results");
  let failures = 0;

  function test(name, fn) {
    const entry = document.createElement("li");
    try {
      fn();
      entry.className = "pass";
      entry.textContent = `PASS ${name}`;
    } catch (error) {
      failures += 1;
      entry.className = "fail";
      entry.textContent = `FAIL ${name}: ${error.message}`;
    }
    results.append(entry);
  }

  function assertEqual(actual, expected, label = "") {
    const a = JSON.stringify(actual);
    const e = JSON.stringify(expected);
    if (a !== e) throw new Error(`${label} expected ${e}, got ${a}`);
  }

  function setup(layout) {
    const box = document.createElement("div");
    box.className = "sandbox";
    document.body.append(box);
    const actions = [];
    const renderer = createWidgetRenderer(box, { onAction: (a) => actions.push(a) });
    if (layout) renderer.renderLayout(layout);
    return { box, renderer, actions };
  }

  const p = (type, x, y) => ({ version: 1, type, x, y, source: "mouse" });
  // Center of the "capture" button in workspaceLayout.
  const CAPTURE = [0.28, 0.35];
  const ASK = [0.72, 0.35];

  // Keep console output quiet for tests that expect warnings.
  const realWarn = console.warn;
  console.warn = () => {};

  test("renders buttons and text at normalized positions", () => {
    const { box } = setup(workspaceLayout("window-1"));
    const capture = box.querySelector('[data-widget-id="capture"]');
    assertEqual(capture.classList.contains("surfaceos-widget--button"), true, "button class");
    assertEqual(capture.tagName, "BUTTON", "native button element");
    assertEqual(capture.style.left, "8%", "left");
    assertEqual(capture.style.width, "40%", "width");
    assertEqual(box.querySelector('[data-widget-id="title"]').textContent, "Workspace", "text");
    assertEqual(box.querySelectorAll(".surfaceos-widget").length, 5, "widget count");
  });

  test("press and release on the same button activates once", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    renderer.handlePointer(p("pointer_move", 0.3, 0.36));
    renderer.handlePointer(p("pointer_up", 0.3, 0.36));
    assertEqual(actions, [{ version: 1, window_id: "window-1", widget_id: "capture", event: "activate" }]);
  });

  test("holding and moving does not repeat activations", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    for (let i = 0; i < 10; i += 1) renderer.handlePointer(p("pointer_move", 0.2 + i * 0.01, 0.35));
    assertEqual(actions.length, 0, "no action while held");
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 1, "one action on release");
  });

  test("release over a different button does not activate", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    renderer.handlePointer(p("pointer_move", ...ASK));
    renderer.handlePointer(p("pointer_up", ...ASK));
    assertEqual(actions.length, 0);
  });

  test("pressing empty space then releasing on a button does not activate", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", 0.5, 0.5));
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0);
  });

  test("pointer_cancel clears the press and pressed styling", () => {
    const { box, renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    assertEqual(box.querySelector('[data-widget-id="capture"]').classList.contains("surfaceos-widget--pressed"), true, "pressed");
    renderer.handlePointer({ version: 1, type: "pointer_cancel", source: "hand" });
    assertEqual(box.querySelectorAll(".surfaceos-widget--pressed").length, 0, "no pressed widgets");
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0, "no action after cancel");
  });

  test("re-rendering keeps a press while its button remains", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    renderer.renderLayout(workspaceLayout("window-1", 1));
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 1);
  });

  test("re-rendering cancels a press when its button is removed or disabled", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    renderer.renderLayout(notesLayout("window-1"));
    renderer.renderLayout(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0, "removed");
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    const layout = workspaceLayout("window-1");
    layout.widgets[1].disabled = true;
    renderer.renderLayout(layout);
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0, "disabled");
  });

  test("a layout for a different window cancels the press", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    renderer.renderLayout(workspaceLayout("window-9"));
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0);
  });

  test("elements are reused across renders", () => {
    const { box, renderer } = setup(workspaceLayout("window-1"));
    const before = box.querySelector('[data-widget-id="capture"]');
    renderer.renderLayout(workspaceLayout("window-1", 3));
    assertEqual(box.querySelector('[data-widget-id="capture"]') === before, true, "same element");
    assertEqual(box.querySelector('[data-widget-id="count"]').textContent, "Pressed 3 times");
  });

  test("disabled buttons render but do not activate", () => {
    const layout = workspaceLayout("window-1");
    layout.widgets[1].disabled = true;
    const { box, renderer, actions } = setup(layout);
    assertEqual(box.querySelector('[data-widget-id="capture"]').classList.contains("surfaceos-widget--disabled"), true);
    assertEqual(renderer.handlePointer(p("pointer_down", ...CAPTURE)), false);
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0);
  });

  test("variants become class names and invalid ones are warned", () => {
    const { box } = setup({ version: 1, window_id: "w", widgets: [
      { id: "a", type: "text", x: 0, y: 0, width: 1, height: 0.5, text: "a", variant: ["large", "left"] },
      { id: "b", type: "text", x: 0, y: 0.5, width: 1, height: 0.5, text: "b", variant: "x\" onclick=\"y" },
    ] });
    const a = box.querySelector('[data-widget-id="a"]');
    assertEqual(a.classList.contains("surfaceos-v-large") && a.classList.contains("surfaceos-v-left"), true, "classes");
    assertEqual(box.querySelectorAll(".surfaceos-widget-warnings li").length, 1, "warning");
    assertEqual(box.querySelector('[data-widget-id="b"]').getAttribute("onclick"), null, "no attribute injection");
  });

  test("icons render as built-in SVG and unknown icons are warned", () => {
    const { box } = setup({ version: 1, window_id: "w", widgets: [
      { id: "a", type: "button", x: 0, y: 0, width: 0.5, height: 1, text: "Play", icon: "play" },
      { id: "b", type: "button", x: 0.5, y: 0, width: 0.5, height: 1, text: "Oops", icon: "not-an-icon" },
    ] });
    const a = box.querySelector('[data-widget-id="a"]');
    assertEqual(a.querySelector("svg.surfaceos-icon") !== null, true, "svg drawn");
    assertEqual(a.textContent, "Play", "label kept");
    assertEqual(box.querySelector('[data-widget-id="b"] svg'), null, "unknown icon ignored");
    assertEqual(box.querySelectorAll(".surfaceos-widget-warnings li").length, 1, "warning");
  });

  test("text inputs report edits and Enter without re-renders overwriting typing", () => {
    const layout = (value) => ({ version: 1, window_id: "w", widgets: [
      { id: "field", type: "input", x: 0, y: 0, width: 1, height: 0.3, value, placeholder: "<b>hint</b>" },
    ] });
    const { box, renderer, actions } = setup(layout(""));
    const field = box.querySelector('[data-widget-id="field"]');
    assertEqual([field.tagName, field.placeholder], ["INPUT", "<b>hint</b>"], "native text field, placeholder as text");
    field.value = "abc";
    field.dispatchEvent(new Event("input"));
    field.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" }));
    assertEqual(actions.map((a) => [a.window_id, a.widget_id, a.event, a.value]),
      [["w", "field", "change", "abc"], ["w", "field", "submit", "abc"]]);
    renderer.renderLayout(layout(""));
    assertEqual(field.value, "abc", "unchanged layout value keeps what was typed");
    renderer.renderLayout(layout("new"));
    assertEqual(field.value, "new", "a changed layout value replaces the text");
    assertEqual(renderer.handlePointer(p("pointer_down", 0.5, 0.1)), false, "inputs are not pointer buttons");
  });

  test("embed content is never moved when other widgets come and go", () => {
    const embed = { id: "e", type: "embed", x: 0, y: 0.2, width: 1, height: 0.8 };
    const { box, renderer } = setup({ version: 1, window_id: "w", widgets: [embed] });
    const element = renderer.getElement("e");
    const frame = document.createElement("iframe");
    element.append(frame);
    const removed = [];
    const observer = new MutationObserver((records) => records.forEach((r) => removed.push(...r.removedNodes)));
    observer.observe(box, { childList: true, subtree: true });
    renderer.renderLayout({ version: 1, window_id: "w", widgets: [
      { id: "before", type: "text", x: 0, y: 0, width: 1, height: 0.2, text: "a" }, embed,
      { id: "over", type: "button", x: 0.4, y: 0.4, width: 0.2, height: 0.2, text: "b" },
    ] });
    renderer.renderLayout({ version: 1, window_id: "w", widgets: [embed] });
    observer.takeRecords().forEach((r) => removed.push(...r.removedNodes));
    observer.disconnect();
    assertEqual(removed.includes(element) || removed.includes(frame), false, "embed and its iframe stayed attached");
    assertEqual(element.firstChild === frame, true, "app content inside the embed untouched");
    assertEqual(element.className.includes("surfaceos-widget--embed"), true);
  });

  test("canvas and video widgets are exposed through getElement", () => {
    const { renderer } = setup({ version: 1, window_id: "w", widgets: [
      { id: "c", type: "canvas", x: 0, y: 0, width: 0.5, height: 1 },
      { id: "v", type: "video", x: 0.5, y: 0, width: 0.5, height: 1 },
    ] });
    assertEqual(renderer.getElement("c").tagName, "CANVAS");
    assertEqual(renderer.getElement("v").tagName, "VIDEO");
    assertEqual(renderer.getElement("missing"), null);
  });

  test("layout coordinates are copied, so later edits do not move hit targets", () => {
    const layout = workspaceLayout("window-1");
    const { renderer, actions } = setup(layout);
    layout.widgets[1].x = 0.9;
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 1);
  });

  test("text widgets are not pressable", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", 0.5, 0.1));
    renderer.handlePointer(p("pointer_up", 0.5, 0.1));
    assertEqual(actions.length, 0);
  });

  test("out-of-bounds points hit nothing", () => {
    const { renderer, actions } = setup({
      version: 1, window_id: "w", widgets: [{ id: "b", type: "button", x: 0, y: 0, width: 1, height: 1, text: "all" }],
    });
    renderer.handlePointer(p("pointer_down", 1.2, 0.5));
    renderer.handlePointer(p("pointer_up", 1.2, 0.5));
    renderer.handlePointer(p("pointer_down", 0.5, 0.5));
    renderer.handlePointer(p("pointer_up", 0.5, -0.1));
    assertEqual(actions.length, 0);
  });

  test("hover follows pointer_move", () => {
    const { box, renderer } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_move", ...CAPTURE));
    assertEqual(box.querySelector('[data-widget-id="capture"]').classList.contains("surfaceos-widget--hover"), true, "hover on");
    renderer.handlePointer(p("pointer_move", 0.5, 0.5));
    assertEqual(box.querySelectorAll(".surfaceos-widget--hover").length, 0, "hover off");
  });

  test("two renderers keep their actions separate", () => {
    const one = setup(workspaceLayout("window-1"));
    const two = setup(notesLayout("window-2"));
    two.renderer.handlePointer(p("pointer_down", 0.7, 0.8));
    two.renderer.handlePointer(p("pointer_up", 0.7, 0.8));
    assertEqual(one.actions.length, 0, "window-1 actions");
    assertEqual(two.actions, [{ version: 1, window_id: "window-2", widget_id: "next", event: "activate" }]);
  });

  test("invalid widgets are skipped with visible warnings", () => {
    const { box } = setup(brokenLayout("window-2"));
    assertEqual([...box.querySelectorAll(".surfaceos-widget")].map((e) => e.dataset.widgetId), ["ok", "html"], "rendered ids");
    assertEqual(box.querySelectorAll(".surfaceos-widget-warnings li").length, 4, "warning count");
  });

  test("layout text is never parsed as HTML", () => {
    const { box } = setup(brokenLayout("window-2"));
    const html = box.querySelector('[data-widget-id="html"]');
    assertEqual(html.querySelector("b"), null, "no element created");
    assertEqual(html.textContent, "<b>shown as text, not bold</b>");
  });

  test("bad layouts do not throw and are rejected", () => {
    const { box, renderer } = setup();
    for (const bad of [null, "x", { version: 2, window_id: "w", widgets: [] }, { version: 1, widgets: [] },
                       { version: 1, window_id: "w", widgets: "no" }]) {
      assertEqual(renderer.renderLayout(bad), false, JSON.stringify(bad));
    }
    assertEqual(box.querySelectorAll(".surfaceos-widget").length, 0, "nothing rendered");
    assertEqual(box.querySelectorAll(".surfaceos-widget-warnings li").length > 0, true, "visible warning");
  });

  test("an invalid layout keeps the previous content", () => {
    const { box, renderer, actions } = setup(workspaceLayout("window-1"));
    assertEqual(renderer.renderLayout({ version: 2, window_id: "window-1", widgets: [] }), false, "rejected");
    assertEqual(box.querySelectorAll(".surfaceos-widget").length, 5, "old widgets remain");
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 1, "old widgets still work");
  });

  test("pointer events must carry version 1", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    const unversioned = { type: "pointer_down", x: CAPTURE[0], y: CAPTURE[1] };
    assertEqual(renderer.handlePointer(unversioned), false, "rejected");
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0);
  });

  test("handlePointer reports whether it used the event", () => {
    const { renderer } = setup(workspaceLayout("window-1"));
    assertEqual(renderer.handlePointer(p("pointer_down", 0.5, 0.5)), false, "down on empty space");
    assertEqual(renderer.handlePointer(p("pointer_up", 0.5, 0.5)), false, "up on empty space");
    assertEqual(renderer.handlePointer(p("pointer_down", ...CAPTURE)), true, "down on button");
    assertEqual(renderer.handlePointer({ version: 1, type: "pointer_cancel" }), true, "cancel of a press");
    assertEqual(renderer.handlePointer(p("pointer_down", ...CAPTURE)), true, "down again");
    assertEqual(renderer.handlePointer(p("pointer_up", ...CAPTURE)), true, "activation");
  });

  test("malformed pointer events are ignored", () => {
    const { renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.handlePointer(null);
    renderer.handlePointer({ version: 1, type: "click", x: 0.28, y: 0.35 });
    renderer.handlePointer({ version: 1, type: "pointer_down", x: "0.28", y: 0.35 });
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0);
  });

  test("a throwing onAction handler does not break the renderer", () => {
    const box = document.createElement("div");
    document.body.append(box);
    const realError = console.error;
    console.error = () => {};
    const renderer = createWidgetRenderer(box, { onAction: () => { throw new Error("boom"); } });
    renderer.renderLayout(workspaceLayout("window-1"));
    renderer.handlePointer(p("pointer_down", ...CAPTURE));
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    console.error = realError;
    renderer.handlePointer(p("pointer_down", ...ASK));
    assertEqual(renderer.handlePointer(p("pointer_up", ...ASK)), true, "still activates after a throw");
  });

  test("clear removes content and ignores later pointers", () => {
    const { box, renderer, actions } = setup(workspaceLayout("window-1"));
    renderer.clear();
    assertEqual(box.querySelectorAll(".surfaceos-widget").length, 0, "no widgets");
    assertEqual(renderer.handlePointer(p("pointer_down", ...CAPTURE)), false, "down ignored");
    renderer.handlePointer(p("pointer_up", ...CAPTURE));
    assertEqual(actions.length, 0, "no actions");
  });

  console.warn = realWarn;
  const summary = document.getElementById("summary");
  summary.textContent = failures === 0 ? "ALL TESTS PASSED" : `${failures} TEST(S) FAILED`;
  summary.className = failures === 0 ? "pass" : "fail";
  document.body.dataset.done = "true";
</script>
</body>
</html>
