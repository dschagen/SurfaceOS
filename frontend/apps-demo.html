<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurfaceOS apps</title>
<link rel="stylesheet" href="widgets.css">
<style>
  /* Stand-in shell styles for this demo only. Carter's shell replaces all of this. */
  :root {
    --ink: #13233b;
    --grid: rgba(160, 200, 255, 0.08);
    --grid-major: rgba(160, 200, 255, 0.16);
    --paper: #eef3fa;
    --cursor: #8fdcff;
    --press: #ffb347;
    --muted: #7d93b2;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background-color: var(--ink);
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    color: var(--paper);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }

  #canvas { position: fixed; inset: 0; touch-action: none; }

  .demo-window {
    position: absolute;
    border: 2px solid rgba(238, 243, 250, 0.3);
    border-radius: 14px;
    background-color: rgba(17, 22, 37, 0.92);
  }

  .demo-window.focused { border-color: var(--cursor); }

  .demo-window-tab {
    position: absolute;
    bottom: 100%;
    left: 10px;
    right: 10px;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: var(--muted);
  }

  .demo-window.focused .demo-window-tab { color: var(--paper); }

  .demo-window-tab button {
    font: inherit;
    border: 0;
    background: none;
    color: inherit;
    cursor: pointer;
    padding: 0 4px;
  }

  #toolbar {
    position: fixed;
    top: 12px;
    left: 16px;
    right: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  #toolbar button {
    font: inherit;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--muted);
    background-color: rgba(19, 35, 59, 0.9);
    color: var(--paper);
    cursor: pointer;
  }

  #toolbar .spacer { flex: 1; }

  #hand-status { font-size: 13px; color: var(--muted); }
  #hand-status.live { color: var(--cursor); }

  #hand-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 34px;
    height: 34px;
    margin: -17px 0 0 -17px;
    border: 4px solid var(--cursor);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
  }

  #hand-cursor.pressing { background-color: var(--press); border-color: var(--press); }
</style>
</head>
<body>
  <div id="canvas"></div>

  <div id="toolbar">
    <span id="open-buttons"></span>
    <span class="spacer"></span>
    <span id="hand-status">Hand tracker: not connected</span>
    <button id="fullscreen">Fullscreen</button>
  </div>

  <div id="hand-cursor" hidden></div>

<script type="module">
  import { mountApp, APPS } from "./apps/app-host.js";

  const HAND_SERVER = "ws://localhost:8765";
  const MAX_WINDOWS = 4;
  // Top of the usable canvas, below the toolbar.
  const TOP = 0.09;

  const canvas = document.getElementById("canvas");
  const handStatus = document.getElementById("hand-status");
  const handCursor = document.getElementById("hand-cursor");

  // ---- Stand-in window manager: fixed 2x2 slots. Carter's shell replaces this. ----

  const windows = [];
  let nextWindowNumber = 1;
  let focused = null;

  function slotRect(index, count) {
    const cols = count <= 1 ? 1 : 2;
    const rowsCount = count <= 2 ? 1 : 2;
    const gap = 0.03;
    const width = (0.96 - gap * (cols - 1)) / cols;
    const height = (1 - TOP - 0.03 - gap * (rowsCount - 1)) / rowsCount;
    const col = index % cols;
    const row = Math.floor(index / cols);
    return { x: 0.02 + col * (width + gap), y: TOP + 0.02 + row * (height + gap), width, height };
  }

  function layoutWindows() {
    windows.forEach((win, i) => {
      Object.assign(win.record, slotRect(i, windows.length));
      const { x, y, width, height } = win.record;
      Object.assign(win.frame.style, { left: `${x * 100}%`, top: `${y * 100}%`, width: `${width * 100}%`, height: `${height * 100}%` });
    });
  }

  function focus(win) {
    focused = win;
    windows.forEach((w) => w.frame.classList.toggle("focused", w === win));
  }

  function closeWindow(win) {
    win.app.destroy();
    win.frame.remove();
    windows.splice(windows.indexOf(win), 1);
    if (focused === win) focus(windows.at(-1) ?? null);
    layoutWindows();
  }

  function openWindow(type) {
    if (windows.length >= MAX_WINDOWS) closeWindow(windows[0]);
    const record = { id: `window-${nextWindowNumber++}`, x: 0, y: 0, width: 0, height: 0, content: type, surface_id: "main" };
    const frame = document.createElement("div");
    frame.className = "demo-window";
    const tab = document.createElement("div");
    tab.className = "demo-window-tab";
    const title = document.createElement("span");
    title.textContent = `${APPS[type].title} · ${record.id}`;
    const close = document.createElement("button");
    close.textContent = "Close";
    tab.append(title, close);
    const content = document.createElement("div");
    frame.append(tab, content);
    canvas.append(frame);

    const win = { record, frame, content, app: null };
    windows.push(win);
    layoutWindows();
    win.app = mountApp(content, {
      type,
      windowId: record.id,
      onAction: (action) => console.debug("widget action", action),
    });
    close.addEventListener("click", () => closeWindow(win));
    focus(win);
  }

  const openButtons = document.getElementById("open-buttons");
  for (const [type, definition] of Object.entries(APPS)) {
    const b = document.createElement("button");
    b.textContent = definition.title;
    b.addEventListener("click", () => openWindow(type));
    openButtons.append(b, " ");
  }

  // ---- Pointer routing: full-canvas event -> the right window, in its local space. ----

  let capturedWindow = null;

  function toLocal(win, event) {
    const canvasBox = canvas.getBoundingClientRect();
    const box = win.content.getBoundingClientRect();
    const px = canvasBox.left + event.x * canvasBox.width;
    const py = canvasBox.top + event.y * canvasBox.height;
    return { ...event, x: (px - box.left) / box.width, y: (py - box.top) / box.height };
  }

  function windowAt(event) {
    for (let i = windows.length - 1; i >= 0; i -= 1) {
      const local = toLocal(windows[i], event);
      if (local.x >= 0 && local.x <= 1 && local.y >= 0 && local.y <= 1) return windows[i];
    }
    return null;
  }

  function dispatchCanvasPointer(event) {
    if (event.type === "pointer_cancel") {
      windows.forEach((win) => win.app.handlePointer({ version: 1, type: "pointer_cancel", source: event.source }));
      capturedWindow = null;
      return;
    }
    if (event.type === "pointer_down") {
      capturedWindow = windowAt(event);
      if (capturedWindow) {
        focus(capturedWindow);
        capturedWindow.app.handlePointer(toLocal(capturedWindow, event));
      }
      return;
    }
    if (event.type === "pointer_up") {
      const target = capturedWindow;
      capturedWindow = null;
      if (target) target.app.handlePointer(toLocal(target, event));
      return;
    }
    const targets = capturedWindow ? [capturedWindow] : windows;
    targets.forEach((win) => win.app.handlePointer(toLocal(win, event)));
  }

  // ---- Mouse adapter: emits the same event shape the hand tracker does. ----

  function mouseEvent(type, domEvent) {
    const box = canvas.getBoundingClientRect();
    const clamp = (v) => Math.min(1, Math.max(0, v));
    return {
      version: 1, type, source: "mouse",
      x: clamp((domEvent.clientX - box.left) / box.width),
      y: clamp((domEvent.clientY - box.top) / box.height),
    };
  }

  let mouseDown = false;
  canvas.addEventListener("pointermove", (e) => dispatchCanvasPointer(mouseEvent("pointer_move", e)));
  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest(".demo-window-tab")) return;
    mouseDown = true;
    canvas.setPointerCapture(e.pointerId);
    dispatchCanvasPointer(mouseEvent("pointer_down", e));
  });
  canvas.addEventListener("pointerup", (e) => {
    if (!mouseDown) return;
    mouseDown = false;
    // Dispatched inside the real mouseup, so apps can use APIs that need a user gesture.
    dispatchCanvasPointer(mouseEvent("pointer_up", e));
  });
  const cancelMouse = () => {
    if (!mouseDown) return;
    mouseDown = false;
    dispatchCanvasPointer({ version: 1, type: "pointer_cancel", source: "mouse" });
  };
  canvas.addEventListener("pointercancel", cancelMouse);
  window.addEventListener("blur", cancelMouse);

  // ---- Keyboard fallback goes to the focused window. ----

  for (const type of ["keydown", "keyup"]) {
    window.addEventListener(type, (e) => {
      if (!focused || e.ctrlKey || e.metaKey || e.altKey) return;
      if (focused.app.handleKey({ type, key: e.key })) e.preventDefault();
    });
  }

  // ---- Hand input from the tracker's WebSocket (docs/input.md). ----

  function handleHandMessage(message) {
    if (!message || message.version !== 1) return;
    if (Number.isFinite(message.x)) {
      handCursor.style.transform = `translate(${message.x * window.innerWidth}px, ${message.y * window.innerHeight}px)`;
    }
    if (message.type === "pointer_cancel") {
      handCursor.hidden = true;
      handCursor.classList.remove("pressing");
    } else if (message.type.startsWith("pointer_")) {
      handCursor.hidden = false;
      if (message.type === "pointer_down") handCursor.classList.add("pressing");
      if (message.type === "pointer_up") handCursor.classList.remove("pressing");
    }
    // double_pinch is for window creation, which belongs to the real shell.
    if (["pointer_move", "pointer_down", "pointer_up", "pointer_cancel"].includes(message.type)) dispatchCanvasPointer(message);
  }

  function connectHand() {
    const socket = new WebSocket(HAND_SERVER);
    socket.onopen = () => {
      handStatus.textContent = "Hand tracker: connected";
      handStatus.classList.add("live");
    };
    socket.onmessage = (event) => {
      try {
        handleHandMessage(JSON.parse(event.data));
      } catch (error) {
        console.warn("Bad hand message", event.data);
      }
    };
    socket.onclose = () => {
      handStatus.textContent = "Hand tracker: not connected (mouse works)";
      handStatus.classList.remove("live");
      handCursor.hidden = true;
      dispatchCanvasPointer({ version: 1, type: "pointer_cancel", source: "hand" });
      setTimeout(connectHand, 2000);
    };
  }

  document.getElementById("fullscreen").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  // apps-demo.html?open=calculator,chess opens those apps on load.
  const params = new URLSearchParams(location.search);
  const initial = (params.get("open") ?? "calculator,chess").split(",").filter((type) => APPS[type]);
  initial.slice(0, MAX_WINDOWS).forEach(openWindow);
  if (params.get("hand") !== "0") connectHand();
</script>
</body>
</html>
