<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SurfaceOS</title>
<link rel="stylesheet" href="./styles/main.css"><link rel="stylesheet" href="../../frontend/widgets.css">
<script type="module" src="./scripts/app.js"></script><script type="module" src="./scripts/hand-bubbles.js"></script><script type="module" src="./scripts/hand-bridge.js"></script><script type="module" src="../../frontend/shell-adapter.js"></script></head>
<body><main id="stage" aria-label="SurfaceOS projected canvas">
<div id="surfaces"></div><div id="outline" hidden></div><div id="cursor" hidden></div>
<section id="setup" class="panel setup" aria-label="Surface calibration"><p class="eyebrow">SURFACEOS / SETUP</p><h1>Define surface <span id="surface-number">1</span></h1><p>Drag each corner onto the usable boundary of this physical surface. Keep all four corners on one flat plane.</p><div class="setup-actions"><button id="confirm-surface">Confirm surface</button><button id="finish-setup" hidden>Enter workspace</button><button id="add-surface" hidden>Add another surface</button><button id="accept-alignment" hidden>Alignment looks right</button><button id="retry-alignment" hidden>Retry this surface</button></div><p id="setup-message" role="status">Move the four points, then confirm.</p></section>
<div id="calibration" aria-label="Four calibration corners"></div>
<section id="dialog" class="panel dialog" hidden role="dialog" aria-modal="true"></section>
<nav id="actions" class="panel actions" hidden aria-label="Main menu"><button data-action="new">Make Window</button><button data-action="screenshot">Screenshot</button><button data-action="surface">New Surface</button></nav>
<div id="surface-labels" hidden></div><footer><span>SURFACEOS</span><span id="status" role="status">Calibrate surface 1</span><span id="hand-status">Hand · connecting</span><button id="actions-button" hidden>Menu</button><button id="manage-button" hidden>Manage</button><button id="close-button" hidden>Close</button><button id="fullscreen">Fullscreen</button></footer>
</main></body></html>
